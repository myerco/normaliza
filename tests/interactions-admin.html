<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testes de administração — NORMALIZA!</title>
  <style>
    html,
    body {
      margin: 0;
      background: #07111d;
      color: #f7f1e3;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    main { padding: 1rem; }
    iframe {
      width: 1200px;
      max-width: 100%;
      height: 1000px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: #0b1622;
    }
    pre {
      padding: 1rem;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      white-space: pre-wrap;
    }
    body[data-interaction-status="pass"] #out { border-left: 4px solid #2a9d8f; }
    body[data-interaction-status="fail"] #out { border-left: 4px solid #e76f51; }
  </style>
</head>
<body>
  <main>
    <h1>Administração de arquétipos e atributos</h1>
    <p id="summary">Executando…</p>
    <iframe id="app-frame" title="Aplicação NORMALIZA! para testes administrativos"></iframe>
    <pre id="out"></pre>
  </main>

  <script src="./browser-fixture.js"></script>
  <script>
    const frame = document.getElementById('app-frame');
    const summary = document.getElementById('summary');
    const out = document.getElementById('out');
    const checks = [];
    let win;

    frame.addEventListener('load', () => {
      run().catch((error) => {
        checks.push({ name: 'execução geral', ok: false, detail: String(error && error.stack || error) });
        finish(error);
      });
    });

    NormalizaTestFixture.seedActivePlayer({ name: 'Admin Teste', avatarId: 'analista' });
    frame.src = '../index.html?test=1#/admin';

    async function run() {
      win = frame.contentWindow;
      const doc = frame.contentDocument;
      await waitFor(() => doc.documentElement.dataset.appReady === 'true' && doc.querySelector('.admin-page'), 'administração');

      check('administração avisa sobre proteção local', doc.querySelector('.admin-warning').textContent.includes('autorização administrativa'));
      check('catálogo tem três arquétipos', doc.querySelectorAll('.admin-section')[0].querySelectorAll('.admin-form:not(.admin-form--new)').length === 3);
      check('catálogo tem quatro atributos', doc.querySelectorAll('.admin-section')[1].querySelectorAll('.admin-form:not(.admin-form--new)').length === 4);
      check('matriz começa com doze valores', doc.querySelectorAll('.admin-value').length === 12);
      check('administração lista perfis de jogadores', doc.querySelectorAll('.admin-section')[3].textContent.includes('Perfis'));
      check('administração lista imagens de personagem', doc.querySelectorAll('.admin-section')[4].querySelectorAll('.admin-form').length === 5);

      const firstValue = doc.querySelector('.admin-value');
      firstValue.value = '9';
      doc.querySelector('.admin-values button[type="submit"]').click();
      await waitFor(() => doc.querySelector('.form-success') && doc.querySelector('.admin-value').value === '9', 'valor salvo');
      check('valor inicial é persistido', readCatalog(win).values.engenheiro['sql-basico'] === 9);

      const attributeSection = doc.querySelectorAll('.admin-section')[1];
      const attributeForm = attributeSection.querySelector('.admin-form--new');
      setInput(attributeForm.querySelector('.text-input'), 'Modelagem de Dados');
      setInput(attributeForm.querySelectorAll('.text-input')[1], 'Modelagem conceitual.');
      attributeForm.querySelector('button[type="submit"]').click();
      await waitFor(() => doc.querySelectorAll('.admin-value').length === 15, 'atributo criado');
      check('atributo novo aparece no catálogo', doc.querySelectorAll('.admin-section')[1].textContent.includes('Modelagem de Dados'));
      const catalogAfterAttribute = readCatalog(win);
      const newAttribute = catalogAfterAttribute.attributes.find((attribute) => attribute.slug === 'modelagem-de-dados');
      check('atributo novo recebe valor inicial 1', catalogAfterAttribute.values.engenheiro[newAttribute.id] === 1);

      const archetypeSection = doc.querySelectorAll('.admin-section')[0];
      const archetypeForm = archetypeSection.querySelector('.admin-form--new');
      setInput(archetypeForm.querySelector('.text-input'), 'Cientista de Dados');
      setInput(archetypeForm.querySelectorAll('.text-input')[1], 'Experimentação e análise.');
      archetypeForm.querySelector('button[type="submit"]').click();
      await waitFor(() => doc.querySelectorAll('.admin-section')[0].querySelectorAll('.admin-form:not(.admin-form--new)').length === 4, 'arquétipo criado');
      check('arquétipo novo aparece no catálogo', doc.querySelectorAll('.admin-section')[0].textContent.includes('Cientista de Dados'));
      check('arquétipo novo recebe todos os atributos', Object.keys(readCatalog(win).values[readCatalog(win).archetypes[3].id]).length === 5);

      finish();
    }

    function readCatalog(win) {
      return JSON.parse(win.localStorage.getItem('normaliza:v3:catalog') || '{}');
    }

    function setInput(input, value) {
      input.value = value;
      input.dispatchEvent(new win.Event('input', { bubbles: true }));
    }

    function check(name, condition) {
      if (!condition) {
        throw new Error(`Falhou: ${name}`);
      }
      checks.push({ name, ok: true });
    }

    function waitFor(predicate, description, timeout = 9000) {
      return new Promise((resolve, reject) => {
        const startedAt = Date.now();
        const tick = () => {
          try {
            const value = predicate();
            if (value) { resolve(value); return; }
          } catch (error) {
            reject(error);
            return;
          }
          if (Date.now() - startedAt > timeout) {
            reject(new Error(`Timeout aguardando: ${description}`));
            return;
          }
          setTimeout(tick, 50);
        };
        tick();
      });
    }

    function finish(error) {
      const failed = Boolean(error) || checks.some((checkItem) => !checkItem.ok);
      const passed = checks.filter((checkItem) => checkItem.ok).length;
      document.body.dataset.interactionStatus = failed ? 'fail' : 'pass';
      summary.textContent = failed
        ? `Falha nos testes administrativos (${passed} verificações passaram).`
        : `Todos os testes administrativos passaram (${passed} verificações).`;
      out.textContent = JSON.stringify({ failed, checks }, null, 2);
      document.title = failed ? 'FAIL - Administração NORMALIZA!' : 'PASS - Administração NORMALIZA!';
    }
  </script>
</body>
</html>
