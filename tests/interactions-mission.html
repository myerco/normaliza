<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testes da missão Administração — NORMALIZA!</title>
  <style>
    html,
    body {
      margin: 0;
      background: #07111d;
      color: #f7f1e3;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    main {
      padding: 1rem;
    }

    iframe {
      width: 1200px;
      max-width: 100%;
      height: 800px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: #0b1622;
    }

    pre {
      padding: 1rem;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      white-space: pre-wrap;
    }

    body[data-interaction-status="pass"] #out {
      border-left: 4px solid #2a9d8f;
    }

    body[data-interaction-status="fail"] #out {
      border-left: 4px solid #e76f51;
    }
  </style>
</head>
<body>
  <main>
    <h1>Testes da missão Administração da Cidade</h1>
    <p id="summary">Executando…</p>
    <iframe id="app-frame" title="Aplicação NORMALIZA! para testes da missão"></iframe>
    <pre id="out"></pre>
  </main>

  <script>
    const frame = document.getElementById('app-frame');
    const summary = document.getElementById('summary');
    const out = document.getElementById('out');
    const checks = [];

    frame.addEventListener('load', () => {
      run().catch((error) => {
        checks.push({ name: 'execução geral', ok: false, detail: String(error && error.stack || error) });
        finish(error);
      });
    });

    frame.src = '../index.html#/cidade';

    async function run() {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;

      await waitFor(
        () => doc.documentElement.dataset.appReady === 'true' && doc.getElementById('city-main'),
        'aplicação inicializada'
      );
      await waitFor(() => doc.querySelector('#info-panel .panel__mission .btn'), 'entrada da missão');

      check('painel oferece a missão especial', doc.querySelector('#info-panel .panel__mission .btn').textContent.includes('Administração'));
      doc.querySelector('#info-panel .panel__mission .btn').click();

      await waitFor(
        () => !doc.getElementById('mission-screen').hidden && doc.querySelector('#mission-host .mission-shell'),
        'missão aberta'
      );

      const mission = doc.getElementById('mission-host');
      check('rota da missão ativa', win.location.hash === '#/missao/administracao');
      check('HUD mostra a missão', doc.querySelector('.hud__phase-name').textContent.includes('Administração'));
      check('missão mostra o título', mission.querySelector('.phase-title').textContent === 'Administração da Cidade');
      check('missão tem três abas', mission.querySelectorAll('.mission-tab').length === 3);
      check('missão começa com zero anomalias', mission.querySelector('.mission-progress strong').textContent.trim() === '0 / 3');

      mission.querySelector('[data-action="update-one"]').click();
      await waitFor(() => mission.querySelector('.phase-feedback--error'), 'inconsistência de atualização');
      const updateRows = [...mission.querySelectorAll('.mission-model--denormalized .mission-table tbody tr')];
      check('atualização de uma linha cria inconsistência', updateRows.some((row) => row.textContent.includes('Ariquemes')) && updateRows.some((row) => row.textContent.includes('Porto Velho')));
      check('linha inconsistente é destacada', mission.querySelectorAll('.mission-table tr.is-inconsistent').length >= 1);

      mission.querySelector('[data-action="update-normalized"]').click();
      await waitFor(() => mission.querySelector('.phase-feedback--success') && mission.querySelector('.mission-progress strong').textContent.trim() === '1 / 3', 'atualização normalizada');
      const normalizedUpdateTables = mission.querySelectorAll('.mission-model--normalized .mission-table');
      const normalizedEmployeeRows = [...normalizedUpdateTables[1].querySelectorAll('tbody tr')];
      check(
        'atualização normalizada propaga para os funcionários',
        normalizedEmployeeRows.filter((row) => row.textContent.includes('TI')).every((row) => row.textContent.includes('Ariquemes'))
      );
      check('aba de atualização concluída', mission.querySelector('[data-tab="update"]').classList.contains('is-complete'));

      mission.querySelector('[data-tab="insert"]').click();
      await waitFor(() => mission.querySelector('[data-tab="insert"]').classList.contains('is-active'), 'aba de inserção');

      mission.querySelector('[data-action="insert-denormalized"]').click();
      await waitFor(() => mission.querySelector('.mission-blocked'), 'inserção desnormalizada bloqueada');
      check('inserção desnormalizada é bloqueada', mission.querySelector('.mission-blocked').textContent.includes('pedido'));
      check(
        'produto não aparece na tabela desnormalizada',
        !mission.querySelector('.mission-model--denormalized .mission-table').textContent.includes('Grampeador')
      );

      mission.querySelector('[data-action="insert-normalized"]').click();
      await waitFor(() => mission.querySelector('.mission-progress strong').textContent.trim() === '2 / 3', 'inserção normalizada');
      check(
        'produto é cadastrado no modelo normalizado',
        mission.querySelector('.mission-model--normalized').textContent.includes('Grampeador')
      );
      check('aba de inserção concluída', mission.querySelector('[data-tab="insert"]').classList.contains('is-complete'));

      mission.querySelector('[data-tab="delete"]').click();
      await waitFor(() => mission.querySelector('[data-tab="delete"]').classList.contains('is-active'), 'aba de exclusão');

      const normalizedDeleteTablesBefore = mission.querySelectorAll('.mission-model--normalized .mission-table');
      check(
        'modelo normalizado começa com quatro itens',
        normalizedDeleteTablesBefore[0].querySelectorAll('tbody tr').length === 4
      );

      mission.querySelector('[data-action="delete-denormalized"]').click();
      await waitFor(() => mission.querySelector('.mission-lost-list'), 'produtos perdidos');
      check(
        'exclusão desnormalizada perde Borracha e Régua',
        mission.querySelector('.mission-lost-list').textContent.includes('Borracha') &&
          mission.querySelector('.mission-lost-list').textContent.includes('Régua')
      );
      check(
        'modelo normalizado preserva os itens antes da exclusão normalizada',
        mission.querySelectorAll('.mission-model--normalized .mission-table')[0].querySelectorAll('tbody tr').length === 4
      );

      mission.querySelector('[data-action="delete-normalized"]').click();
      await waitFor(() => mission.querySelector('.mission-complete') && mission.querySelector('.mission-progress strong').textContent.trim() === '3 / 3', 'missão concluída');

      const normalizedDeleteTablesAfter = mission.querySelectorAll('.mission-model--normalized .mission-table');
      check('modelo normalizado remove o pedido 002', normalizedDeleteTablesAfter[0].querySelectorAll('tbody tr').length === 2);
      check('modelo normalizado preserva quatro produtos', normalizedDeleteTablesAfter[1].querySelectorAll('tbody tr').length === 4);
      check('três abas concluídas', mission.querySelectorAll('.mission-tab.is-complete').length === 3);
      check(
        'conclusão resume as três anomalias',
        mission.querySelector('.mission-complete').textContent.includes('Atualização') &&
          mission.querySelector('.mission-complete').textContent.includes('Inserção') &&
          mission.querySelector('.mission-complete').textContent.includes('Exclusão')
      );

      mission.querySelector('[data-action="complete-exit"]').click();
      await waitFor(
        () => !doc.getElementById('city-main').hidden && doc.getElementById('mission-screen').hidden,
        'retorno à cidade'
      );
      check('missão volta para a cidade', win.location.hash === '#/cidade');

      finish();
    }

    function check(name, condition) {
      if (!condition) {
        throw new Error(`Falhou: ${name}`);
      }

      checks.push({ name, ok: true });
    }

    function waitFor(predicate, description, timeout = 8000) {
      return new Promise((resolve, reject) => {
        const startedAt = Date.now();

        const tick = () => {
          try {
            if (predicate()) {
              resolve();
              return;
            }
          } catch (error) {
            reject(error);
            return;
          }

          if (Date.now() - startedAt > timeout) {
            reject(new Error(`Timeout aguardando: ${description}`));
            return;
          }

          setTimeout(tick, 50);
        };

        tick();
      });
    }

    function finish(error) {
      const failed = Boolean(error) || checks.some((checkItem) => !checkItem.ok);
      const passed = checks.filter((checkItem) => checkItem.ok).length;

      document.body.dataset.interactionStatus = failed ? 'fail' : 'pass';
      summary.textContent = failed
        ? `Falha nos testes da missão (${passed} verificações passaram).`
        : `Todos os testes da missão passaram (${passed} verificações).`;
      out.textContent = JSON.stringify({ failed, checks }, null, 2);
      document.title = failed ? 'FAIL — Missão NORMALIZA!' : 'PASS — Missão NORMALIZA!';
    }
  </script>
</body>
</html>
