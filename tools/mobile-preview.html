<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prévia mobile — NORMALIZA!</title>
  <style>
    html,
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 209, 102, 0.08), transparent 42%),
        #07111d;
    }

    iframe {
      width: 390px;
      height: 844px;
      border: 0;
      border-radius: 26px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
      background: #0b1622;
    }
  </style>
</head>
<body>
  <iframe id="preview-frame" title="Prévia mobile do NORMALIZA!"></iframe>
  <script>
    const route = new URLSearchParams(window.location.search).get('rota');
    document.getElementById('preview-frame').src =
      route === 'fase'
        ? '../index.html#/fase/centro-de-distribuicao'
        : route === 'fase2'
          ? '../index.html#/fase/rede-de-dependencias'
          : route === 'fase3'
            ? '../index.html#/fase/cidade-organizada'
            : route === 'missao'
              ? '../index.html#/missao/administracao'
              : '../index.html#/cidade/pedido';
  </script>
</body>
</html>
