<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prévia mobile — NORMALIZA!</title>
  <style>
    html,
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 209, 102, 0.08), transparent 42%),
        #07111d;
    }

    iframe {
      width: 390px;
      height: 844px;
      border: 0;
      border-radius: 26px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
      background: #0b1622;
    }
  </style>
</head>
<body>
  <iframe id="preview-frame" title="Prévia mobile do NORMALIZA!"></iframe>
  <script>
    const now = new Date().toISOString();
    const playerId = 'mobile-demo-player';
    localStorage.setItem(
      'normaliza:v2:players',
      JSON.stringify({
        version: 2,
        activePlayerId: playerId,
        players: [
          {
            id: playerId,
            name: 'Ana Construtora',
            avatarId: 'construtor',
            createdAt: now,
            updatedAt: now,
            lastActivityAt: now,
            remoteId: null,
            remoteOwnerId: null,
            syncStatus: 'local'
          }
        ]
      })
    );
    localStorage.setItem(
      `normaliza:v2:player:${playerId}:ranking`,
      JSON.stringify({
        updatedAt: now,
        rows: [
          { player_id: 'r1', name: 'Carla Engenheira', avatar_id: 'engenheiro', total_score: 400, completed_phases: 4, score_achieved_at: now },
          { player_id: playerId, name: 'Ana Construtora', avatar_id: 'construtor', total_score: 320, completed_phases: 3, score_achieved_at: now },
          { player_id: 'r2', name: 'Bruno Arquiteto', avatar_id: 'arquiteto', total_score: 260, completed_phases: 3, score_achieved_at: now }
        ]
      })
    );

    const route = new URLSearchParams(window.location.search).get('rota');
    const suffix =
      route === 'fase'
        ? '#/fase/centro-de-distribuicao'
        : route === 'fase2'
          ? '#/fase/rede-de-dependencias'
          : route === 'fase3'
            ? '#/fase/cidade-organizada'
            : route === 'fase4'
              ? '#/fase/gestao-de-funcionarios-e-pedidos'
              : route === 'missao'
                ? '#/missao/administracao'
                : route === 'perfil'
                  ? '#/perfil'
                  : route === 'ranking'
                    ? '#/ranking'
                    : route === 'conquistas'
                      ? '#/conquistas'
                      : route === 'home'
                        ? '#/'
                        : '#/cidade/pedido';

    document.getElementById('preview-frame').src = `../index.html?test=1${suffix}`;
  </script>
</body>
</html>
